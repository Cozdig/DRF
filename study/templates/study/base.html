<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Базовый шаблон{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/">Курсы</a>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
            </form>
        {% else %}
            <a class="p-2 btn btn-outline-primary" href="/user/login/">Вход</a>
            <a class="p-2 btn btn-outline-primary" href="/user/register/">Регистрация</a>
        {% endif %}

    </nav>
</div>

<div class="container">
{% block content %}{% endblock %}
    <footer class="pt-4 my-md-5 pt-md-5 border-top">
          <div class="row">
              <div class="col-6 col-md">
                  <h5>Категории</h5>
                  <ul class="list-unstyled text-small">
                      <li><a class="text-muted" href="#">Рассылки</a></li>
                      <li><a class="text-muted" href="#">Телеграм боты</a></li>
                      <li><a class="text-muted" href="#">Полезные утилиты</a></li>
                      <li><a class="text-muted" href="#">Веб-приложения</a></li>
                      <li><a class="text-muted" href="#">Микросервисы</a></li>
                  </ul>
              </div>
              <div class="col-6 col-md">
                  <h5>Дополнительно</h5>
                  <ul class="list-unstyled text-small">
                      <li><a class="text-muted" href="#">Мы пишем</a></li>
                  </ul>
              </div>
              <div class="col-6 col-md">
                  <h5>О нас</h5>
                  <ul class="list-unstyled text-small">
                      <li><a class="text-muted" href="/contacts/">Контакты</a></li>
                  </ul>
              </div>
          </div>
      </footer>

</div>
<script src="/static/js/bootstrap.min.js"></script>
</body>
</html>
