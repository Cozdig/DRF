[tool.poetry]
name = "drf"
version = "0.1.0"
description = ""
authors = ["Cozdig <tank-20@list.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = ">=5.2,<6.0"
djangorestframework = "^3.16.1"
pillow = "^12.1.0"
psycopg2 = "^2.9.11"
python-dotenv = "^1.2.1"
psycopg2-binary = "^2.9.11"
django-filter = "^25.2"
djangorestframework-simplejwt = "^5.5.1"
drf-yasg = "^1.21.14"
stripe = "^14.3.0"
celery = "^5.6.2"
eventlet = "^0.40.4"
django-celery-beat = "^2.8.1"
redis = "^7.1.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''